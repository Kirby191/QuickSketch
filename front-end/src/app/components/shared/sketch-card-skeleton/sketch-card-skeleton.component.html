<div
      data-testid="sketch-skeleton-grid"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      aria-busy="true"
      aria-label="Caricamento disegni in corso"
    >
      @for (item of itemsArray(); track item) {
        <div
          class="rounded-2xl bg-slate-900/90 border border-slate-800/80 overflow-hidden shadow-lg flex flex-col animate-pulse"
        >
          <!-- Skeleton Header: Categoria + Autore -->
          <div class="px-5 py-3.5 border-b border-slate-800/80 flex items-center justify-between">
            <div class="h-5 w-20 rounded-full bg-slate-800"></div>
            <div class="h-4 w-28 rounded-md bg-slate-800/70"></div>
          </div>

          <!-- Skeleton Area Immagine Canvas (proporzione 4:3 identica alla card reale) -->
          <div class="aspect-4/3 w-full bg-slate-950/80 flex items-center justify-center p-6">
            <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-700 text-2xl">
              🎨
            </div>
          </div>

          <!-- Skeleton Corpo: Caselle Parola + Statistiche + Bottone CTA -->
          <div class="p-5 flex-1 flex flex-col justify-between gap-4">
            <div class="flex flex-col items-center gap-2.5">
              <div class="h-3 w-24 rounded bg-slate-800/60"></div>
              <div class="flex gap-1.5">
                @for (slot of [1, 2, 3, 4, 5, 6]; track slot) {
                  <div class="w-6 h-8 rounded-md bg-slate-800"></div>
                }
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between">
              <div class="h-4 w-24 rounded bg-slate-800/70"></div>
              <div class="h-4 w-16 rounded bg-slate-800/70"></div>
            </div>

            <div class="h-11 w-full rounded-xl bg-slate-800"></div>
          </div>
        </div>
      }
    </div>
